{{- if and .Values.secret.enabled (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vllm.hfSecretName" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 下载 gated 模型（如 Llama 系列）时才需要；公开模型保持 secret.enabled=false 即可
  HF_TOKEN: {{ required "secret.enabled=true 且未提供 existingSecret 时必须填写 secret.hfToken" .Values.secret.hfToken | quote }}
{{- end }}
